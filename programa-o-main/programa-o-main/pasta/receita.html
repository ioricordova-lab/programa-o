<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Receita - Chef Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="btn-voltar">⬅ Voltar para o Início</a>
        <h1 id="titulo-receita">Carregando...</h1>
    </header>

    <main class="container receita-interna">
        <button id="btn-modo-cozinha" class="btn" style="margin-bottom: 20px;">
            💡 Manter Tela Acesa
        </button>
        <div class="seletor-porcoes">
            <label for="porcoes">Quantas pessoas vão comer? </label>
            <input type="number" id="porcoes" value="1" min="1" max="10">
        </div>

        <section class="ingredientes">
            <h2>Ingredientes</h2>
            <ul id="lista-ingredientes"></ul>
        </section>

        <section class="preparo">
            <h2>Modo de Preparo</h2>
            <ol id="lista-preparo"></ol>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
